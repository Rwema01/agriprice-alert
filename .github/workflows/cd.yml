
name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agriprice-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and test
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest ansible

          ruff check .
          pytest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name agripriceacr

      - name: Build, tag, and push image to Azure ACR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="agripriceacr.azurecr.io/agriprice-app"

          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Setup SSH Key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' > "$HOME/.ssh/azure-key"

          chmod 600 "$HOME/.ssh/azure-key"

          ssh-keygen -y -f "$HOME/.ssh/azure-key" > /dev/null

          echo "SSH private key configured successfully."

      - name: Configure SSH known hosts
        shell: bash
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "ERROR: SSH_KNOWN_HOSTS secret is empty."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            | tr -d '\r' > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install Ansible collections
        shell: bash
        run: |
          set -euo pipefail

          ansible-galaxy collection install \
            community.docker \
            community.general

      - name: Temporarily allow GitHub Actions runner SSH
        id: allow-runner-ssh
        shell: bash
        run: |
          set -euo pipefail

          BASTION_NSG="bastion-nsg"
          RULE_NAME="gha-ssh-${GITHUB_RUN_ID}"

          RUNNER_IP="$(curl -4 -fsS https://api.ipify.org)"

          if [[ ! "$RUNNER_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid GitHub Actions runner IPv4 address."
            exit 1
          fi

          echo "GitHub Actions runner IP: ${RUNNER_IP}"

          BASTION_RG="$(az network nsg list \
            --query "[?name=='${BASTION_NSG}'].resourceGroup | [0]" \
            --output tsv)"

          if [[ -z "$BASTION_RG" || "$BASTION_RG" == "None" ]]; then
            echo "ERROR: Bastion NSG not found."
            exit 1
          fi

          echo "BASTION_RG=${BASTION_RG}" >> "$GITHUB_ENV"
          echo "BASTION_SSH_RULE=${RULE_NAME}" >> "$GITHUB_ENV"

          USED_PRIORITIES="$(az network nsg rule list \
            --resource-group "$BASTION_RG" \
            --nsg-name "$BASTION_NSG" \
            --query "[].priority" \
            --output tsv)"

          PRIORITY=""

          for candidate in $(seq 110 4096); do
            if ! grep -Fxq "$candidate" <<< "$USED_PRIORITIES"; then
              PRIORITY="$candidate"
              break
            fi
          done

          if [[ -z "$PRIORITY" ]]; then
            echo "ERROR: No available NSG rule priority."
            exit 1
          fi

          az network nsg rule create \
            --resource-group "$BASTION_RG" \
            --nsg-name "$BASTION_NSG" \
            --name "$RULE_NAME" \
            --priority "$PRIORITY" \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes "${RUNNER_IP}/32" \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 22

          echo "Temporary Bastion SSH rule created."

      - name: Verify Bastion SSH connectivity
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing TCP connectivity to Bastion..."

          nc -vz -w 15 158.158.105.80 22

          echo "Testing Bastion SSH authentication..."

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/azure-key" \
            ubuntu@158.158.105.80 \
            "echo BASTION_SSH_SUCCESS"

      - name: Test Ansible SSH connectivity
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_TIMEOUT: "30"
        run: |
          set -euo pipefail

          ansible app-vm \
            -i ansible/inventory.ini \
            -m ansible.builtin.ping \
            -vvv

      - name: Run Ansible Playbook
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_TIMEOUT: "30"
        run: |
          set -euo pipefail

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml

      - name: Remove temporary GitHub Actions SSH rule
        if: always()
        shell: bash
        run: |
          if [[ -z "${BASTION_RG:-}" || -z "${BASTION_SSH_RULE:-}" ]]; then
            echo "No temporary SSH rule registered."
            exit 0
          fi

          az network nsg rule delete \
            --resource-group "$BASTION_RG" \
            --nsg-name bastion-nsg \
            --name "$BASTION_SSH_RULE"

          echo "Temporary GitHub Actions SSH rule removed."
