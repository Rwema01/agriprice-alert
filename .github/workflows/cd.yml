name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
          pytest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name agripriceacr
          echo "${{ secrets.ACR_PASSWORD }}" | docker login agripriceacr.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build, tag, and push image to Azure ACR
        run: |
          docker build -t agripriceacr.azurecr.io/agriprice-app:${{ github.sha }} -t agripriceacr.azurecr.io/agriprice-app:latest .
          docker push agripriceacr.azurecr.io/agriprice-app:${{ github.sha }}
          docker push agripriceacr.azurecr.io/agriprice-app:latest

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/azure-key
          chmod 400 ~/.ssh/azure-key

      - name: Add Bastion to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
