name: F3 DevSecOps CI Pipeline

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: F2 Foundation (Lint, Test, Build)
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest
        run: pytest

      - name: Build Docker Image
        run: docker build -t agriprice-app:latest .

  # JOB 2: F3 Requirement - Checkov (Terraform Security)
  checkov-scan:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: false
          # Skipping enterprise rules (replication, logging, lifecycle) that require AWS billing
          skip_check: CKV_AWS_144,CKV_AWS_18,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_21,CKV_AWS_145

  # JOB 3: F3 Requirement - pip-audit (Dependency Security)
  pip-audit-scan:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  # JOB 4: F3 Requirement - Trivy (Container Security)
  trivy-scan:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t agriprice-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'agriprice-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'