[app_server]
app-vm ansible_host=<APP_PRIVATE_IP> # e.g., 10.0.2.45

[app_server:vars]
ansible_user=ubuntu
# This tells Ansible to SSH into the Bastion first, then jump to the App VM
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no -i ~/.ssh/agriprice-key.pem ubuntu@<BASTION_PUBLIC_IP>"'
ansible_ssh_private_key_file=~/.ssh/agriprice-key.pem