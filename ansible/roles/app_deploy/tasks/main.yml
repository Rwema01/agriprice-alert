---
- name: Update apt cache
  apt:
    update_cache: yes
  changed_when: false

- name: Install dependencies (Docker, Docker Compose, UFW, AWS CLI)
  apt:
    name: 
      - docker.io
      - docker-compose
      - ufw
      - awscli
    state: present

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Configure UFW firewall (Allow 5000)
  ufw:
    rule: allow
    port: '5000'
    proto: tcp

- name: Configure UFW firewall (Allow SSH 22)
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Harden SSH (Disable root login)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart ssh

- name: Log in to AWS ECR
  shell: |
    aws ecr get-login-password --region <YOUR_AWS_REGION> | docker login --username AWS --password-stdin <YOUR_ECR_URL>
  register: ecr_login

- name: Create deployment directory
  file:
    path: /home/ubuntu/deployment
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy docker-compose.yml to the server
  copy:
    src: ../../deployment/docker-compose.yml
    dest: /home/ubuntu/deployment/docker-compose.yml

- name: Deploy the application using Docker Compose
  shell: |
    cd /home/ubuntu/deployment
    export ECR_REGISTRY=<YOUR_ECR_URL>
    export ECR_REPO=agriprice-app
    export DB_HOST=<YOUR_RDS_ENDPOINT>
    export DB_NAME=agriprice
    export DB_USER=postgres
    export DB_PASSWORD=ChooseAPassword123!
    docker-compose up -d