---
- name: Update apt cache
  apt:
    update_cache: yes
  changed_when: false

- name: Remove old docker-compose (v1)
  apt:
    name: docker-compose
    state: absent

- name: Install Docker and UFW
  apt:
    name: 
      - docker.io
      - ufw
    state: present

- name: Install Docker Compose v2 Plugin
  shell: |
    mkdir -p /usr/local/lib/docker/cli-plugins
    curl -SL https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
    chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Configure UFW firewall (Allow 5000)
  ufw:
    rule: allow
    port: '5000'
    proto: tcp

- name: Configure UFW firewall (Allow SSH 22)
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Harden SSH (Disable root login)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart ssh

- name: Log in to Azure ACR
  shell: |
    echo "{{ lookup('env', 'ACR_PASSWORD') }}" | docker login agripriceacr.azurecr.io -u {{ lookup('env', 'ACR_USERNAME') }} --password-stdin
  register: acr_login

- name: Create deployment directory
  file:
    path: /home/ubuntu/deployment
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy docker-compose.yml to the server
  copy:
    src: "{{ playbook_dir }}/../deployment/docker-compose.yml"
    dest: /home/ubuntu/deployment/docker-compose.yml

- name: Deploy the application using Docker Compose v2
  shell: |
    docker compose down --remove-orphans || true
    docker compose pull
    docker compose up -d --remove-orphans --force-recreate
  args:
    chdir: /home/ubuntu/deployment
  environment:
    ECR_REGISTRY: "agripriceacr.azurecr.io"
    ECR_REPO: "agriprice-app"
    DB_HOST: "158.158.40.90"
    DB_NAME: "agriprice"
    DB_USER: "postgres"
    DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"