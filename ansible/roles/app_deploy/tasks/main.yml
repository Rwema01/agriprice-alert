
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Remove old docker-compose v1
  ansible.builtin.apt:
    name: docker-compose
    state: absent

- name: Install Docker, UFW and required utilities
  ansible.builtin.apt:
    name:
      - docker.io
      - ufw
      - curl
      - ca-certificates
    state: present

- name: Install Docker Compose v2 Plugin
  ansible.builtin.get_url:
    url: https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-linux-x86_64
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: '0755'
    force: false

- name: Start Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Configure UFW firewall (Allow application port 5000)
  community.general.ufw:
    rule: allow
    port: '5000'
    proto: tcp

- name: Configure UFW firewall (Allow SSH port 22)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Harden SSH (Disable root login)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

- name: Install Azure CLI
  ansible.builtin.shell: |
    curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash
  args:
    creates: /usr/bin/az

- name: Authenticate to Azure using the VM managed identity
  ansible.builtin.command:
    argv:
      - az
      - login
      - --identity
      - --allow-no-subscriptions
  changed_when: false
  no_log: true

- name: Log in to Azure Container Registry using managed identity
  ansible.builtin.command:
    argv:
      - az
      - acr
      - login
      - --name
      - agripriceacr
  no_log: true

- name: Create deployment directory
  ansible.builtin.file:
    path: /home/ubuntu/deployment
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy docker-compose.yml to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deployment/docker-compose.yml"
    dest: /home/ubuntu/deployment/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Pull the latest application image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - pull
  args:
    chdir: /home/ubuntu/deployment
  environment:
    ECR_REGISTRY: "agripriceacr.azurecr.io"
    ECR_REPO: "agriprice-app"
    DB_HOST: "158.158.40.90"
    DB_NAME: "agriprice"
    DB_USER: "postgres"
    DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"
    FLASK_SECRET_KEY: "{{ lookup('env', 'FLASK_SECRET_KEY') }}"
  no_log: true

- name: Deploy the application using Docker Compose v2
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --remove-orphans
      - --force-recreate
  args:
    chdir: /home/ubuntu/deployment
  environment:
    ECR_REGISTRY: "agripriceacr.azurecr.io"
    ECR_REPO: "agriprice-app"
    DB_HOST: "158.158.40.90"
    DB_NAME: "agriprice"
    DB_USER: "postgres"
    DB_PASSWORD: "{{ lookup('env', 'DB_PASSWORD') }}"
    FLASK_SECRET_KEY: "{{ lookup('env', 'FLASK_SECRET_KEY') }}"
  no_log: true
